---
name: Lint

on: [push, pull_request]

permissions: {}

jobs:
  run-linters:
    name: Run linters
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # lint-action reports results as check runs

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v2

      - uses: actions/setup-node@v3

      - run: npm ci

      - name: Run linters
        uses: wearerequired/lint-action@v2
        with:
          stylelint: true
